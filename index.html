<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinanceManager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:ital,wght@0,200..800;1,200..800&family=Inter:ital,opsz@0,14..32;1,14..32&family=Mulish:ital,wght@0,200..1000;1,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Quicksand:wght@300..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script type="module" crossorigin src="./assets/index-D1XnNn79.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-D-6IWiT3.css">
</head>

<body>

  <main class="main">

    <section class="login">
      <div class="login__container">
        <div class="login__card login__card--one">
          <h2 class="login__title">Zaczynamy</h2>
          <p class="login__text">Uzupełnij <span class="login__animateSpan">dane</span> aby zacząć korzystać z <span
              class="login__animateSpan">aplikacji</span></p>
          <button class="login__btn">Dalej</button>
        </div>
        <div class="login__card login__card--two">
          <h2 class="login__title">Uzupełnij Dane</h2>
          <div class="login__inputCard">
            <input class="login__input login__input--name" type="text" placeholder="Wpisz swoję imię:">
          </div>
          <div class="login__inputCard">
            <input class="login__input login__input--money" type="number" placeholder="Wpisz kwotę startową:">
          </div>
          <div class="login__inputCard">
            <input class="login__input login__input--budget" type="number" placeholder="Wpisz swój budżet">
          </div>
          <button class="login__start">Zaczynamy</button>
        </div>
      </div>
    </section>

    <section class="upper">
      <div class="upper__header">
        <p class="upper__header-name"></p>
        <i class="bi bi-gear-fill"></i>
      </div>
      <div class="upper__middle">
        <p class="upper__middle-text">Aktualny stan:</p>
        <p class="upper__middle-amount"></p>
      </div>
      <div class="upper__middle-texts">
        <p class="upper__middle-text">Aktualny limit</p>
        <p class="upper__middle-text upper__middle-budget"></p>
      </div>
      <div class="upper__middle-line">
        <div class="upper__middle-bar"></div>
      </div>
      <div class="upper__middle-btns">
        <button class="upper__middle-btn upper__middle-btn--inflow">Wpływ</button>
        <button class="upper__middle-btn upper__middle-btn--">Wydatek</button>
      </div>
    </section>

    <section class="lower">
      <div class="lower__header">
        <p class="lower__header-text">Operacje</p>
        <div class="lower__header-line"></div>
        <p class="lower__header-text">Wszystko</p>
      </div>
      <div class="lower__container">

        <div class="lower__card">
          <div class="lower__card-left">
            <i class="bi bi-bag-fill"></i>
            <div class="lower__card-texts">
              <p class="lower__card-name">Żabka</p>
              <p class="lower__card-category">Sklep spożywczy</p>
            </div>
          </div>
          <div class="lower__card-right">
            <p class="lower__card-price">-39,99 ZŁ</p>
          </div>
        </div>

        <div class="lower__card">
          <div class="lower__card-left">
            <i class="bi bi-bag-fill"></i>
            <div class="lower__card-texts">
              <p class="lower__card-name">Żabka</p>
              <p class="lower__card-category">Sklep spożywczy</p>
            </div>
          </div>
          <div class="lower__card-right">
            <p class="lower__card-price">-39,99 ZŁ</p>
          </div>
        </div>

        <div class="lower__card">
          <div class="lower__card-left">
            <i class="bi bi-bag-fill"></i>
            <div class="lower__card-texts">
              <p class="lower__card-name">Żabka</p>
              <p class="lower__card-category">Sklep spożywczy</p>
            </div>
          </div>
          <div class="lower__card-right">
            <p class="lower__card-price">-39,99 ZŁ</p>
          </div>
        </div>
      </div>
    </section>

    <div class="notification">
      <div class="notification__text"></div>
    </div>

  </main>

</body>

</html>
